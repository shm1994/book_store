{% extends "_base.html" %}

{% block content %}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow-sm">
                    <div class="card-body text-center">

                        <h3 class="mb-3">Password Changed</h3>

                        <p class="text-muted">

                    </div>
                </div>

            </div>
        </div>
    </div>

{% endblock %}
