<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>
<body style="margin:0;padding:0;background:#f5f6fa;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f6fa;padding:40px 0;">
    <tr>
        <td align="center">

            <table width="500" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:8px;padding:30px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">

                <tr>
                    <td style="text-align:center;padding-bottom:20px;">
                        <h2 style="margin:0;color:#333;">Password Reset</h2>
                    </td>
                </tr>

                <tr>
                    <td style="color:#555;font-size:15px;line-height:1.6;">
                        سلام {{ user.username }}،
                        <br><br>
                        درخواستی برای تغییر رمز عبور حساب شما ثبت شده است.
                    </td>
                </tr>

                <tr>
                    <td style="padding:25px 0;text-align:center;">
                        <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
                           style="background:#0d6efd;color:#ffffff;text-decoration:none;padding:12px 25px;border-radius:5px;font-size:15px;display:inline-block;">
                            Reset Password
                        </a>
                    </td>
                </tr>

                <tr>
                    <td style="color:#777;font-size:14px;line-height:1.6;">
                        اگر شما این درخواست را ارسال نکرده‌اید، این ایمیل را نادیده بگیرید و هیچ تغییری در حساب شما
                        ایجاد نخواهد شد.
                    </td>
                </tr>

                <tr>
                    <td style="padding-top:25px;color:#999;font-size:12px;text-align:center;">
                        {{ domain }}
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
