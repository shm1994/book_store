{% extends '_base.html' %}
{% load widget_tweaks %}
{% block page_title %}Home Page{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="card shadow-sm p-4">

            <h1 class="mb-4 text-center">به صفحه اصلی سایت خوش آمدید</h1>

            {% if user.is_authenticated %}
                <div class="text-center">
                    <p class="mb-3">Welcome <strong>{{ user.username }}</strong></p>

                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button class="btn btn-danger">
                            Log Out
                        </button>
                    </form>
                </div>

            {% else %}

                <div class="text-center">
                    <a class="btn btn-primary me-2" href="{% url 'login' %}">
                        Log In
                    </a>

                    <a class="btn btn-success" href="{% url 'signup' %}">
                        Sign Up
                    </a>
                </div>

            {% endif %}

        </div>
    </div>
{% endblock %}
